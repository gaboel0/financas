<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Finanças</title>
<style>
  html,body{height:100%;margin:0;background:#0f172a;color:#e2e8f0;font-family:system-ui,sans-serif}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
  .logo{width:72px;height:72px;border-radius:18px;background:#2563eb;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:700;color:#fff}
  .spin{width:28px;height:28px;border:3px solid #334155;border-top-color:#2563eb;border-radius:50%;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <div class="logo">F</div>
  <div class="spin"></div>
  <div>Iniciando Finanças...</div>
</body>
</html>
